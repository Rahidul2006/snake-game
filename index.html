<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snake game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="panel">
            <div class="info">
                <div class="high inbo">
                    <h1>High Score</h1>
                    <h3 id="highscore">000</h3>
                </div>
                <div class="score inbo">
                    <h1>Score</h1>
                    <h3 id="score">000</h3>
                </div>
                <div class="time inbo">
                    <h1>Time</h1>
                    <span id="time">00 : 00 : 00</span>
                </div>
            </div>
            <div class="board">
                
            </div>
        </section>
        <div class="model">
            <div class="model2">
                <h1>Welcome to snake game....</h1>
                <button id="start-btn">Start</button>
            </div>
        </div>
        <div class="model-re">
            <div class="model2">
                <h1>Game over</h1>
                <button id="Restart-btn">Restart</button>
            </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
